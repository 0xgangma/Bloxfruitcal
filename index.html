<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bloxfruitcal – Blox Fruits Trade Calculator</title>

<meta name="description" content="Accurate Blox Fruits trade calculator. Know if your trade is win, fair, or loss before accepting.">

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>

<body>

<!-- Micro Loader -->
<div id="loader">
  <div class="spinner"></div>
</div>

<div class="app hidden">

  <header>
    <h1>Bloxfruitcal</h1>
    <p class="tagline">Know your trade before you accept.</p>
  </header>

  <label class="label">Value Preset</label>
  <select id="preset" onchange="applyPreset()">
    <option value="stable">Stable</option>
    <option value="demand">High Demand</option>
    <option value="risky">Risky</option>
  </select>

  <section class="trade-section">
    <h3>You Give</h3>
    <div id="giveList"></div>
    <button onclick="addItem('give')">+ Add Item</button>
    <p>Total: <strong><span id="giveTotal">0</span></strong></p>
  </section>

  <section class="trade-section">
    <h3>You Receive</h3>
    <div id="receiveList"></div>
    <button onclick="addItem('receive')">+ Add Item</button>
    <p>Total: <strong><span id="receiveTotal">0</span></strong></p>
  </section>

  <button class="calc" onclick="calculate()">Analyze Trade</button>

  <div class="result-box">
    <div id="difference"></div>
    <div id="fairness"></div>
    <div id="rating"></div>
    <div id="result"></div>
    <div id="suggestion"></div>
  </div>

  <button class="share" onclick="shareTrade()">📤 Share Result</button>

  <footer>
    <p>© 2025 Bloxfruitcal • Community-based values</p>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
